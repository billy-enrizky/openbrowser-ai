# Fast, honest CI.
#
# - PRs run the tests the diff can reach, on Ubuntu, in four measured shards.
# - The merge queue runs the full non-integration suite on Ubuntu and macOS.
# - Lint, format, and type check are a ratchet: existing findings are visible,
#   new findings fail the job.
# - No retries, no widened timeouts, no skipped test selection.
#
# The full suite means `pytest -m "not integration"`. Integration tests need a
# real browser and remain a separate lane; this workflow does not claim they ran.

name: Tests

on:
  pull_request:
    branches: [main, develop]
  merge_group:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.9.15"
  SHARDS: "4"

jobs:
  selection-guard:
    name: selection-guard
    runs-on: ${{ vars.CI_UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-extras
      - name: Select tests
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run --locked python scripts/ci/select_tests.py \
              --base "${{ github.event.pull_request.base.sha }}" \
              --output "$RUNNER_TEMP/selection.json" --summary
          else
            uv run --locked python scripts/ci/select_tests.py --force-all \
              --output "$RUNNER_TEMP/selection.json" --summary
          fi
      - name: Verify shard coverage and balance
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python scripts/ci/shard_tests.py \
            --selection "$RUNNER_TEMP/selection.json" \
            --timings tests/ci/test_timings.json \
            --shards "$SHARDS" --verify-all
      - name: Run selector and sharder tests
        run: |
          uv run --locked pytest tests/ci/test_select_tests.py \
            tests/ci/test_shard_tests.py tests/ci/test_check_baseline.py \
            tests/ci/test_audit_runs.py -q --tb=short -p no:cacheprovider
      - name: Prove selection catches a planted break
        run: uv run --locked python scripts/ci/prove_selection.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selection
          path: ${{ runner.temp }}/selection.json
          retention-days: 1

  static:
    name: static
    runs-on: ${{ vars.CI_UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-extras
      - name: Run Ruff, format, Pyright, and backend compile
        run: uv run --locked python scripts/ci/budget.py --name static -- ./scripts/ci/run_static.sh .

  test:
    name: Test ${{ matrix.os }} shard ${{ matrix.shard }}/4
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (vars.CI_UBUNTU_RUNNER || 'ubuntu-latest') || (vars.CI_MACOS_RUNNER || 'macos-latest') }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Restore recorded test timings
        uses: actions/cache/restore@v4
        with:
          path: tests/ci/test_timings.json
          key: test-timings-${{ github.run_id }}
          restore-keys: test-timings-
          fail-on-cache-miss: false
      - run: uv sync --locked --all-extras
      - name: Select and shard tests
        id: select
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run --locked python scripts/ci/select_tests.py \
              --base "${{ github.event.pull_request.base.sha }}" \
              --output "$RUNNER_TEMP/selection.json" --summary
          else
            uv run --locked python scripts/ci/select_tests.py --force-all \
              --output selection.json --summary
          fi
          uv run --locked python scripts/ci/shard_tests.py \
            --selection selection.json \
            --timings tests/ci/test_timings.json \
            --shards "$SHARDS" --shard "${{ matrix.shard }}" --output shard.txt
          echo "needs_mcp1=$(jq -r '.needs_mcp1' selection.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq -r '.files | length' selection.json)" >> "$GITHUB_OUTPUT"
      - name: Prepare isolated MCP 1.x compatibility client
        if: steps.select.outputs.needs_mcp1 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/mcp1-client"
          uv pip install --python "$RUNNER_TEMP/mcp1-client/bin/python" "mcp==1.26.0"
          "$RUNNER_TEMP/mcp1-client/bin/python" -c \
            'from importlib.metadata import version; assert version("mcp") == "1.26.0"'
          echo "OPENBROWSER_TEST_MCP1_PYTHON=$RUNNER_TEMP/mcp1-client/bin/python" >> "$GITHUB_ENV"
      - name: Run selected tests
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s shard.txt ]; then
            echo "no selected tests for shard ${{ matrix.shard }}"
            exit 0
          fi
          files=()
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              files+=("$file")
            fi
          done < shard.txt
          uv run --locked python scripts/ci/budget.py --name test-shard -- \
            uv run --locked pytest "${files[@]}" -q -m "not integration" \
            -n auto --dist load --tb=short --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.os }}-${{ matrix.shard }}
          path: junit.xml
          if-no-files-found: ignore
          retention-days: 7

  backend-smoke:
    name: backend-smoke
    runs-on: ${{ vars.CI_UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Build and import the app once
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked
          uv run --locked python -c \
            'import app.main; from fastapi import FastAPI; assert isinstance(app.main.app, FastAPI); import app.main as again; assert again.app is app.main.app'

  record-timings:
    name: record-timings
    needs: [test]
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ${{ vars.CI_UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-ubuntu-latest-*
          path: junit
          merge-multiple: true
      - run: uv sync --locked --all-extras
      - name: Record Ubuntu file times
        run: |
          uv run --locked python scripts/ci/record_timings.py \
            --junit junit/*.xml --output tests/ci/test_timings.json
      - uses: actions/upload-artifact@v4
        with:
          name: test-timings
          path: tests/ci/test_timings.json
          retention-days: 7
      - uses: actions/cache/save@v4
        with:
          path: tests/ci/test_timings.json
          key: test-timings-${{ github.run_id }}

  coverage:
    name: coverage
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ${{ vars.CI_UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-extras
      - name: Run the full suite with coverage
        run: |
          uv run --locked python scripts/ci/budget.py --name coverage -- \
            uv run --locked pytest tests/ -q -m "not integration" \
            --cov=src/openbrowser --cov-branch --cov-report=xml --cov-report=term-missing
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  ci-gate:
    name: ci-gate
    if: always()
    needs: [selection-guard, static, test, backend-smoke]
    runs-on: ${{ vars.CI_UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require every gate job to pass
        shell: bash
        env:
          SELECTION: ${{ needs.selection-guard.result }}
          STATIC: ${{ needs.static.result }}
          TEST: ${{ needs.test.result }}
          BACKEND: ${{ needs.backend-smoke.result }}
        run: |
          set -euo pipefail
          echo "selection-guard=$SELECTION static=$STATIC test=$TEST backend-smoke=$BACKEND"
          for result in "$SELECTION" "$STATIC" "$TEST" "$BACKEND"; do
            if [ "$result" != "success" ]; then
              echo "ci-gate failed: a required job did not succeed" >&2
              exit 1
            fi
          done
